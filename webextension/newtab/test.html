<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forkyy Extension Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .status {
      background: rgba(255, 255, 255, 0.2);
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-item:last-child {
      border-bottom: none;
    }
    .status-label {
      font-weight: 600;
    }
    .status-value {
      font-family: monospace;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
    button {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem;
      transition: all 0.3s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .tabs-list {
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }
    .tab-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-url {
      font-size: 0.875rem;
      opacity: 0.7;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Forkyy Extension Test</h1>
    
    <div class="status">
      <div class="status-item">
        <span class="status-label">Extension Context:</span>
        <span class="status-value" id="extensionContext">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Browser API:</span>
        <span class="status-value" id="browserAPI">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Background Script:</span>
        <span class="status-value" id="backgroundScript">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Storage API:</span>
        <span class="status-value" id="storageAPI">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Tabs API:</span>
        <span class="status-value" id="tabsAPI">Checking...</span>
      </div>
    </div>

    <div style="text-align: center; margin: 1.5rem 0;">
      <button onclick="testCreateTab()">Create New Tab</button>
      <button onclick="testGetTabs()">Refresh Tabs List</button>
      <button onclick="testStorage()">Test Storage</button>
    </div>

    <div class="tabs-list" id="tabsList">
      <p style="text-align: center; opacity: 0.7;">Click "Refresh Tabs List" to see open tabs</p>
    </div>
  </div>

  <script src="test.js"></script>
</body>
</html>
